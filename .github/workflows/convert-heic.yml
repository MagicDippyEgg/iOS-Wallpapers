name: HEIC to PNG Converter

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pillow pillow-heif

      - name: Run conversion
        run: |
          python scripts/heic_to_png.py

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit and push in SMALL batches (ACTUAL FIX)
        run: |
          git add -A

          # get staged files safely
          git diff --cached --name-only -z > all_files.txt

          if [ ! -s all_files.txt ]; then
            echo "No changes to commit"
            exit 0
          fi

          echo "Batching files safely..."

          # convert null → newline safely
          tr '\0' '\n' < all_files.txt > files.txt

          # split into chunks of 50 FILES each (very safe)
          split -l 50 files.txt chunk_

          for f in chunk_*; do
            echo "Processing batch: $f"

            git reset

            # re-add files safely
            while IFS= read -r file; do
              git add "$file"
            done < "$f"

            git commit -m "Convert HEIC to PNG (batch)"

            # retry push if needed
            git push || (sleep 5 && git push)
          done
