name: HEIC to PNG Converter

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pillow pillow-heif

      - name: Run conversion
        run: |
          python scripts/heic_to_png.py

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit changes in batches (SAFE PUSH)
        run: |
          git add -A

          # get all staged files
          git diff --cached --name-only > changes.txt

          if [ ! -s changes.txt ]; then
            echo "No changes to commit"
            exit 0
          fi

          split -l 150 changes.txt chunk_

          for f in chunk_*; do
            echo "Processing batch: $f"

            git reset
            cat "$f" | xargs git add

            git commit -m "Convert HEIC to PNG (batch)"
            
            # retry push once if it fails
            git push || (sleep 5 && git push)
          done
